name: tour
# The Bash# tour gate against a PUBLISHED bashy release, on all three OSes.
# This is the install-matrix: a stranger's machine, the published binary,
# every chapter diffed against its pinned transcript. Nothing SKIPs: bashy
# provisions every island's toolchain itself, and each OS runs the gate
# TWICE — `host` (the runner's toolchains on PATH) and `stripped` (PATH holds
# only the shell utilities the gate uses; on Windows only System32) — because
# a fence never resolves its tool from PATH, so the two legs must agree.
#
# Which release: the latest non-prerelease by default (push / PR / nightly —
# the badge is the LATEST release's standing), or the tag given to a manual
# run (`gh workflow run tour -f tag=v0.23.0-dev`) to prove a prerelease
# before it is promoted. The tour's minimum is the first --bashsharp release;
# against anything older the gate is red by design, not broken.
#
# Windows runs the gate through bashy itself, from pwsh: a Windows user has
# no /bin/sh for the shebang and no Git bash either, and the release QA lane
# drives it the same way. The unix legs run it the way the README says —
# `./check.sh`, the host's /bin/sh — so both spellings are covered.
on:
  push:
  pull_request:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: "bashy release tag to test (default: latest non-prerelease)"
        required: false
        default: ""
permissions:
  contents: read
jobs:
  tour:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        leg: [host, stripped]
        include:
          - os: ubuntu-latest
            asset: bashy-linux-amd64.tar.gz
          - os: macos-latest
            asset: bashy-darwin-arm64.tar.gz
          - os: windows-latest
            asset: bashy-windows-amd64.zip
    runs-on: ${{ matrix.os }}
    name: tour (${{ matrix.os }}, ${{ matrix.leg }})
    env:
      TAG: ${{ github.event.inputs.tag }}
      LEG: ${{ matrix.leg }}
    steps:
      - uses: actions/checkout@v4

      # ── unix: download, then the gate under /bin/sh, as the README says ──
      - name: Download the bashy release asset
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -n "$TAG" ]; then url="https://github.com/qiangli/bashy/releases/download/$TAG/${{ matrix.asset }}"
          else url="https://github.com/qiangli/bashy/releases/latest/download/${{ matrix.asset }}"; fi
          echo "$url"
          curl -fsSLO "$url"
          tar -xzf "${{ matrix.asset }}"
          ./bashy --version
      # Ubuntu 24.04 confines an unpackaged rootless podman (bashy's own, on the
      # stripped leg) to the unprivileged_userns AppArmor profile, which denies
      # its re-exec; bashy prints this very sysctl as the host fact. The
      # engine cases need it on this leg only.
      - name: Allow unprivileged user namespaces (bashy's rootless podman)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Tour gate
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ "$LEG" = stripped ]; then
            # PATH = one directory of symlinks to the utilities check.sh itself
            # runs, plus the two setuid shadow-utils a rootless container
            # engine needs (system facts, not toolchains). No python3, node,
            # cargo, clang, cc or go can be found.
            min=$RUNNER_TEMP/minpath; mkdir -p "$min"
            for t in sh uname tr sed grep diff mktemp head printf cat dirname basename cmp rm mkdir sort env cut wc tail ls cp mv chmod touch true false test expr date tee xargs find newuidmap newgidmap; do
              p=$(command -v "$t" 2>/dev/null) && ln -sf "$p" "$min/$t"
            done
            export PATH=$min
            for t in python3 node cargo rustc clang cc go; do command -v "$t" >/dev/null 2>&1 && { echo "$t still on PATH"; exit 1; }; done
          fi
          ./check.sh ./bashy

      # ── windows: only what Windows ships (curl.exe, tar.exe); bashy is the shell ──
      - name: Download the bashy release asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:TAG) { $url = "https://github.com/qiangli/bashy/releases/download/$env:TAG/${{ matrix.asset }}" }
          else { $url = "https://github.com/qiangli/bashy/releases/latest/download/${{ matrix.asset }}" }
          Write-Host $url
          & curl.exe -fsSLO $url
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & tar.exe -xf "${{ matrix.asset }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\bashy.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Tour gate (Windows, through bashy)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:LEG -eq "stripped") {
            # Only what Windows ships: no hostedtoolcache python/node/go, no LLVM, no cargo.
            $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
            foreach ($t in "python3","node","cargo","rustc","clang","go") {
              if (Get-Command $t -ErrorAction SilentlyContinue) { Write-Error "$t still on PATH"; exit 1 }
            }
          }
          $env:Path = "$PWD;" + $env:Path
          & .\bashy.exe ./check.sh "$PWD\bashy.exe"
          exit $LASTEXITCODE
